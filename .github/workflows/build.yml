name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            qt-host: linux
            qt-arch: linux_gcc_64
            binary-arch: x86_64
            executable: build/AppDir/AppRun
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            qt-host: linux_arm64
            qt-arch: linux_gcc_arm64
            binary-arch: arm64
            executable: build/AppDir/AppRun
          - os: windows-2022
            platform: windows-x86_64
            qt-host: windows
            qt-arch: win64_msvc2022_64
            msvc-arch: x64
            binary-arch: x86_64
            executable: build/package/paintAZ/paintAZ.exe
          - os: windows-11-arm
            platform: windows-arm64
            qt-host: windows_arm64
            qt-arch: win64_msvc2022_arm64
            msvc-arch: arm64
            binary-arch: arm64
            executable: build/package/paintAZ/paintAZ.exe
          - os: macos-15-intel
            platform: macos-x86_64
            qt-host: mac
            qt-arch: clang_64
            binary-arch: x86_64
            executable: build/paintAZ.app/Contents/MacOS/paintAZ
          - os: macos-15
            platform: macos-arm64
            qt-host: mac
            qt-arch: clang_64
            binary-arch: arm64
            executable: build/paintAZ.app/Contents/MacOS/paintAZ
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: ${{ matrix.msvc-arch }}
          toolset: "14.44"

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          host: ${{ matrix.qt-host }}
          arch: ${{ matrix.qt-arch }}
          cache: true
          # aqt 3.3.0 cannot resolve the split Qt 6.11+ Windows repositories.
          aqtsource: https://github.com/miurahr/aqtinstall/archive/5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7.tar.gz
          py7zrversion: '==1.1.4'

      - name: Set package name
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -u
          version="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            version="dev-${GITHUB_SHA:0:7}"
          fi
          echo "PACKAGE_NAME=paintAZ-${version}-${PACKAGE_PLATFORM}" >> "$GITHUB_ENV"

      - name: Configure desktop and shared workflow tests
        env:
          BINARY_ARCH: ${{ matrix.binary-arch }}
        run: |
          mkdir -p dist
          args=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=("-DCMAKE_OSX_ARCHITECTURES=$BINARY_ARCH")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DBUILD_TESTING=ON "${args[@]}"

      - name: Build application and native tests
        run: cmake --build build --parallel 3

      - name: Verify native executable architecture
        env:
          BINARY_ARCH: ${{ matrix.binary-arch }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            binary=build/paintAZ.exe
          elif [[ "$RUNNER_OS" == macOS ]]; then
            binary=build/paintAZ.app/Contents/MacOS/paintAZ
          else
            binary=build/paintAZ
          fi
          python .github/scripts/check-architecture.py "$binary" "$BINARY_ARCH"

      - name: Test shared workflows natively
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        env:
          BINARY_ARCH: ${{ matrix.binary-arch }}
        run: bash .github/scripts/package-linux.sh

      - name: Deploy Windows dependencies
        if: runner.os == 'Windows'
        run: |
          mkdir -p build/package/paintAZ
          cp build/paintAZ.exe LICENSE build/package/paintAZ/
          "$QT_ROOT_DIR/bin/windeployqt" --release --no-translations --no-compiler-runtime build/package/paintAZ/paintAZ.exe

      - name: Bundle matching app-local Windows CRT
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY_ARCH: ${{ matrix.binary-arch }}
        run: .github/scripts/package-windows-runtime.ps1 -Architecture $env:BINARY_ARCH

      - name: Deploy macOS dependencies
        if: runner.os == 'macOS'
        run: |
          "$QT_ROOT_DIR/bin/macdeployqt" build/paintAZ.app -always-overwrite
          cp LICENSE build/paintAZ.app/Contents/Resources/LICENSE
          codesign --force --deep --sign - build/paintAZ.app

      - name: Smoke test deployed application
        env:
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python .github/scripts/smoke-test.py "$EXECUTABLE"
          else
            python .github/scripts/smoke-test.py "$EXECUTABLE"
          fi

      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/package/paintAZ -DestinationPath "dist/$env:PACKAGE_NAME.zip"

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/dmg
          cp -R build/paintAZ.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname paintAZ -srcfolder build/dmg -ov -format UDZO "dist/${PACKAGE_NAME}.dmg"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.AppImage *.zip *.dmg > SHA256SUMS.txt

      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" dist/* --verify-tag --draft \
              --title "paintAZ $TAG" --generate-notes "${flags[@]}"
          fi
          gh release edit "$TAG" --draft=false
