name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            qt-arch: gcc_64
            executable: build/AppDir/AppRun
          - os: windows-2022
            platform: windows-x86_64
            qt-arch: win64_msvc2019_64
            executable: build/package/paintAZ/paintAZ.exe
          - os: macos-15-intel
            platform: macos-x86_64
            qt-arch: clang_64
            executable: build/paintAZ.app/Contents/MacOS/paintAZ
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '5.15.2'
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Set package name
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -u
          version="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            version="dev-${GITHUB_SHA:0:7}"
          fi
          echo "PACKAGE_NAME=paintAZ-${version}-${PACKAGE_PLATFORM}" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          mkdir -p build dist
          cd build
          qmake ../paintAZ.pro CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release

      - name: Build on Linux and macOS
        if: runner.os != 'Windows'
        run: make -C build -j3

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: build
        run: nmake /NOLOGO

      - name: Configure shared workflow tests
        run: |
          mkdir -p build/tests
          cd build/tests
          qmake ../../tests/desktop/tests.pro CONFIG+=release CONFIG-=debug CONFIG-=debug_and_release

      - name: Test shared workflows on Windows
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: build/tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          nmake /NOLOGO
          paintAZ-tests.exe

      - name: Test shared workflows on Linux and macOS
        if: runner.os != 'Windows'
        working-directory: build/tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          make -j3
          ./paintAZ-tests

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: bash .github/scripts/package-linux.sh

      - name: Deploy Windows dependencies
        if: runner.os == 'Windows'
        run: |
          mkdir -p build/package/paintAZ
          cp build/paintAZ.exe LICENSE build/package/paintAZ/
          windeployqt --release --no-translations --compiler-runtime build/package/paintAZ/paintAZ.exe

      - name: Deploy macOS dependencies
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/paintAZ.app -always-overwrite
          cp LICENSE build/paintAZ.app/Contents/Resources/LICENSE
          codesign --force --deep --sign - build/paintAZ.app

      - name: Smoke test deployed application
        env:
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python .github/scripts/smoke-test.py "$EXECUTABLE"
          else
            python .github/scripts/smoke-test.py "$EXECUTABLE"
          fi

      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/package/paintAZ -DestinationPath "dist/$env:PACKAGE_NAME.zip"

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/dmg
          cp -R build/paintAZ.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname paintAZ -srcfolder build/dmg -ov -format UDZO "dist/${PACKAGE_NAME}.dmg"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.AppImage *.zip *.dmg > SHA256SUMS.txt

      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" dist/* --verify-tag --draft \
              --title "paintAZ $TAG" --generate-notes "${flags[@]}"
          fi
          gh release edit "$TAG" --draft=false
