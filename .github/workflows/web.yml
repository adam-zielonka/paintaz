name: WebAssembly
on:
  push:
    branches: [main, feat/qt-wasm-issue37]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install matching Qt host tools
        id: host
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.10.3'
          arch: linux_gcc_64
          dir: ${{ runner.temp }}/qt
          cache: true
          aqtversion: '==3.3.0'
      - name: Install Qt WebAssembly
        id: wasm
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.10.3'
          host: all_os
          target: wasm
          arch: wasm_singlethread
          archives: qtbase
          dir: ${{ runner.temp }}/qt
          cache: true
          aqtversion: '==3.3.0'
          set-env: false
      - name: Get pinned Emscripten SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emscripten-core/emsdk
          ref: c69d433d8509c5c64564c2f0d054bf102a5cf67e # 4.0.7
          path: .emsdk
      - name: Build release
        env:
          QT_WASM: ${{ runner.temp }}/qt/Qt/6.10.3/wasm_singlethread
          QT_HOST: ${{ runner.temp }}/qt/Qt/6.10.3/gcc_64
        run: |
          .emsdk/emsdk install 4.0.7
          .emsdk/emsdk activate 4.0.7
          source .emsdk/emsdk_env.sh
          em++ --version
          "$QT_HOST/libexec/moc" --version
          cmake -S . -B build/web -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_WASM/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DQT_HOST_PATH="$QT_HOST"
          cmake --build build/web --parallel 3
      - name: Assemble distributable with corresponding source
        run: python3 .github/scripts/package-web.py
      - name: Install browser test tools (isolated runner)
        run: |
          npm install --prefix tests/web --ignore-scripts --package-lock=false
          tests/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser startup
        run: node tests/web/smoke.mjs --dir dist/web --startup-only
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-test-results-${{ github.sha }}
          path: test-results/web
          if-no-files-found: ignore
      - name: Upload web build
        if: always()

        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paintAZ-web-${{ github.sha }}
          path: dist/web
          retention-days: 14
          if-no-files-found: error
