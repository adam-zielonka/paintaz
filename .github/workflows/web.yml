name: WebAssembly
on:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Build and release]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install matching Qt host tools
        id: host
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          arch: linux_gcc_64
          dir: ${{ runner.temp }}/qt
          cache: true
          aqtsource: https://github.com/miurahr/aqtinstall/archive/5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7.tar.gz
          py7zrversion: '==1.1.4'
      - name: Install Qt WebAssembly
        id: wasm
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          host: all_os
          target: wasm
          arch: wasm_singlethread
          archives: qtbase
          dir: ${{ runner.temp }}/qt
          cache: true
          aqtsource: https://github.com/miurahr/aqtinstall/archive/5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7.tar.gz
          py7zrversion: '==1.1.4'
          set-env: false
      - name: Get pinned Emscripten SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emscripten-core/emsdk
          ref: c9ef2c9d6000341d667a32a807ba47ca489d1e1b # 5.0.5
          path: .emsdk
      - name: Build release
        env:
          QT_WASM: ${{ runner.temp }}/qt/Qt/6.12.0/wasm_singlethread
          QT_HOST: ${{ runner.temp }}/qt/Qt/6.12.0/gcc_64
        run: |
          .emsdk/emsdk install 5.0.5
          .emsdk/emsdk activate 5.0.5
          source .emsdk/emsdk_env.sh
          em++ --version
          "$QT_HOST/libexec/moc" --version
          cmake -S . -B build/web -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_WASM/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DQT_HOST_PATH="$QT_HOST"
          cmake --build build/web --parallel 3
      - name: Assemble distributable with corresponding source
        run: python3 .github/scripts/package-web.py
      - name: Install browser test tools (isolated runner)
        run: |
          npm install --prefix tests/web --ignore-scripts --package-lock=false
          tests/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser image and UI workflows
        run: node tests/web/smoke.mjs --dir dist/web
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-test-results-${{ github.event.workflow_run.head_sha || github.sha }}
          path: test-results/web
          if-no-files-found: ignore
      - name: Upload web build
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paintAZ-web-${{ github.event.workflow_run.head_sha || github.sha }}
          path: dist/web
          retention-days: 14
          if-no-files-found: error

  deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify main still points to the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          actual=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
          test "$actual" = "$EXPECTED_SHA"
      - name: Download tested distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paintAZ-web-${{ github.event.workflow_run.head_sha }}
          path: web-site
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web-site
      - name: Publish tested build
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
